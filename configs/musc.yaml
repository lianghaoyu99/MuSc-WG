datasets:
  dataset_name: 'miniled_ad'  # choice ['mvtec_ad', 'miniled_ad', 'microled_ad']
  data_path: ./data/miniled_AD/  # ./data/mvtec_anomaly_detection/ ./data/miniled_AD/ ./data/microled_AD/
  class_name: 'ALL'  # 'ALL' 'transistor' 'miniled_TypeA_1' 'microled_TypeA_1'
  img_resize: 518  # 512 is for Patch 16 (32*16), for Patch 14 use 518 (37*14)
  divide_num: 1
models:
  backbone_name: 'ViT-L-14-336'
  pretrained: 'openai'
  batch_size: 4
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]
device: 0
testing:
  output_dir: 'output'
  vis: True
  vis_type: single_norm # choice ['single_norm', 'whole_norm']
  save_excel: True
  vis_tsne: True
  tsne_perplexity: 30
  tsne_n_iter: 1000
  tsne_source: 'lnamd' # 'class' or 'lnamd'


# models['backbone_name'] choice:
# ViT-B-32 | ViT-B-16 | ViT-B-16-plus-240
# ViT-L-14 | ViT-L-14-336
# dino_vitbase8 | dino_vitbase16
# dinov2_vitb14 | dinov2_vitl14
# dinov3_vitl16

# models['pretrained'] choice:
# openai (apply to ViT-B-32, ViT-B-16, ViT-L-14 and ViT-L-14-336)
# laion400m_e31 (apply to ViT-B-32, ViT-B-16, ViT-B-16-plus-240 and ViT-L-14)
# laion400m_e32 (apply to ViT-B-32, ViT-B-16, ViT-B-16-plus-240 and ViT-L-14)
